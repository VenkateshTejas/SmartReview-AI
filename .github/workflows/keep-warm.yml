name: Keep Streamlit app awake

# Streamlit Community Cloud puts the app to sleep after ~12h with no viewers,
# and only real browser sessions count -- a plain curl ping does not. This opens
# the app in headless Chromium (clicking "wake up" if it is already asleep).
# Every 4h leaves headroom for GitHub delaying or skipping scheduled runs.
#
# Note: GitHub disables scheduled workflows after 60 days with no commits.
# If that happens, re-enable it from the Actions tab or with:
#   gh workflow enable keep-warm.yml

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4h at :23 (off the top-of-hour rush), UTC
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Visit the app
        run: python .github/scripts/wake_streamlit.py
